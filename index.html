
<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Company AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#101827;color:white}
header{background:#17243a;padding:22px;text-align:center}
header h1{color:#55c7ff;margin:5px}
nav{display:flex;justify-content:center;gap:8px;padding:15px;flex-wrap:wrap}
button{background:#1677d2;color:white;border:0;padding:12px 17px;border-radius:9px;cursor:pointer}
main{padding:18px;max-width:850px;margin:auto}
.card{background:#1c2b43;padding:20px;margin:12px 0;border-radius:13px}
.card h2{color:#55c7ff}
.stat{font-size:28px;font-weight:bold}
input,textarea{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:0}
footer{text-align:center;padding:25px;color:#9eabc0}
</style>
</head>
<body>
<header>
<h1>🤖 Company AI</h1>
<p>Artificial Intelligence Company</p>
</header>

<nav>
<button onclick="show('home')">Home</button>
<button onclick="show('departments')">Departments</button>
<button onclick="show('team')">Team</button>
<button onclick="show('projects')">Projects</button>
<button onclick="show('assistant')">AI Assistant</button>
</nav>

<main id="content"></main>

<footer>Company AI © 2026</footer>

<script>
const pages={
home:`
<div class="card">
<h2>Welcome to Company AI</h2>
<p>Your smart company dashboard.</p>
</div>
<div class="card"><h2>Employees</h2><div class="stat">30</div></div>
<div class="card"><h2>Departments</h2><div class="stat">6</div></div>
<div class="card"><h2>Languages</h2>العربية | Français | English</div>
`,
departments:`
<div class="card"><h2>Company Departments</h2>
<p>1. Administration</p>
<p>2. Technology</p>
<p>3. Artificial Intelligence</p>
<p>4. Marketing</p>
<p>5. Finance</p>
<p>6. Human Resources</p>
</div>`,
team:`
<div class="card"><h2>Our Team</h2>
<p>30 Employees</p>
<p>Company Director</p>
<p>Department Managers</p>
<p>Employees and Assistants</p>
</div>`,
projects:`
<div class="card"><h2>Projects</h2>
<p>Manage your company projects here.</p>
<input id="project" placeholder="Project name">
<button onclick="addProject()">Add Project</button>
<div id="projectList"></div>
</div>`,
assistant:`
<div class="card"><h2>🤖 AI Assistant</h2>
<p>Write your question below.</p>
<textarea id="question" placeholder="Write here..."></textarea>
<button onclick="ask()">Send</button>
<p id="answer"></p>
</div>`
};

function show(page){
document.getElementById('content').innerHTML=pages[page];
}
function addProject(){
let name=document.getElementById('project').value;
if(name){
let p=document.createElement('p');
p.textContent="📁 "+name;
document.getElementById('projectList').appendChild(p);
document.getElementById('project').value="";
}
}
function ask(){
let q=document.getElementById('question').value;
document.getElementById('answer').textContent=
q ? "Your question: "+q+" — AI connection is not configured yet." : "Write a question first.";
}
show('home');
</script>
</body>
</html>
